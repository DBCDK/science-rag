[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "science-rag"
version = "0.1.0"
description = "science-rag"
requires-python = ">= 3.11"
maintainers = [
    { name = "ai", email = "ai@dbc.dk" }
]
dependencies = [
    "langchain-community",
    "langchain-unstructured",
    "langgraph",
    "streamlit",
    "scikit-learn",
    "numpy",
    "nltk",
    "docling",
    "sentence_transformers",
    "rich",
    "transformers",
    "torch",
    "dbc_pyutils",
    "tornado",
    "openai",
    "requests",
    "accelerate",
    "faiss-cpu>=1.14.2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
    "pip-audit",
]

[project.scripts]
create-faiss-index = "science_rag.rag.retrievers.indexes.multilinguale5:main"
streaming-service-science-rag = "science_rag.service:cli"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"science_rag" = ["faktalink_icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[[tool.uv.index]]
name = "dbc-devpi"
url = "https://devpi.dbccloud.dk/dbc/packages/+simple/"
publish-url = "https://devpi.dbccloud.dk/dbc/packages"
